add_newline = true
command_timeout = 200
format = "$hostname$directory$python$git_branch$git_status$cmd_duration\n$character"
right_format = "$time"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[python]
detect_extensions = []
detect_files = []
detect_folders = []
format = '[\($virtualenv\)](bold yellow) '
python_binary = []

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""


[hostname]
ssh_only = false
format = "[$hostname](bold red) "
disabled = false

[cmd_duration]
min_time = 0
format = " [$duration](dimmed yellow)"

[kubernetes]
disabled = false
format = '[$symbol$context( \($namespace\))](dimmed cyan) '
symbol = "k8s:"

[time]
disabled = false
format = "[$time](dimmed white)"
time_format = "%I:%M:%S%P"
style = "dimmed white"

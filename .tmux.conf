unbind C-b
set-option -g prefix C-a
set-option -g default-shell /bin/zsh
bind-key C-a send-prefix

bind | split-window -h
bind - split-window -v

set -g history-limit 5000

# reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# vim-style pane navigation (no prefix needed)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# pane resizing (prefix + H/J/K/L, repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# copy mode + clipboard (wl-copy for Wayland)
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
setw -g mode-keys vi

set -g mouse on

# clock mode
setw -g clock-mode-colour cyan

# copy mode
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=colour052'
set -g pane-active-border-style 'fg=red'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red'

set -g status-left '#[fg=black,bg=cyan,bold] WORK '
set -g status-left-length 30

set -g status-right '#[fg=black,bg=red] #(whoami)@#H #[fg=black,bg=cyan,bold] %m/%d %I:%M %p '
set -g status-right-length 60

setw -g window-status-current-style 'fg=black bg=red'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=red bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=cyan]#F '

setw -g window-status-bell-style 'fg=white bg=red bold'

# messages
set -g message-style 'fg=white bg=red bold'

